<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>場地租借管理</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background: #f2f2f2; }
.btn { padding: 6px 12px; margin-right: 5px; }
</style>
</head>
<body>

<h1>場地租借管理</h1>

<a th:href="@{/rentals/add}">
    <button class="btn">新增租借</button>
</a>

<a th:href="@{/venues}">
    <button class="btn">場地管理</button>
</a>

<br><br>

<table>
<thead>
<tr>
    <th>租借 ID</th>
    <th>場地 ID</th>
    <th>會員 ID</th>
    <th>活動名稱</th>
    <th>租借日期</th>
    <th>參加人數</th>
    <th>付款 ID</th>
    <th>租借狀態</th>
    <th>操作</th>
</tr>
</thead>

<tbody>
<tr th:each="rental : ${rentals}">
    <td th:text="${rental.rentalId}"></td>
    <td th:text="${rental.venueId}"></td>
    <td th:text="${rental.memberId}"></td>
    <td th:text="${rental.eventName}"></td>
    <td th:text="${rental.rentalDate}"></td>
    <td th:text="${rental.guestCount}"></td>
    <td th:text="${rental.paymentId}"></td>
    <td th:text="${rental.rentalStatus}"></td>
    <td>
        <a th:href="@{/rentals/edit/{id}(id=${rental.rentalId})}">
            <button class="btn">修改</button>
        </a>

        <a th:href="@{/rentals/delete/{id}(id=${rental.rentalId})}"
           onclick="return confirm('確定要刪除這筆租借紀錄嗎？')">
            <button class="btn">刪除</button>
        </a>
    </td>
</tr>
</tbody>
</table>

</body>
</html>
