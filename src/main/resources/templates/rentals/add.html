<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新增場地租借</title>
</head>
<body>

<h1>新增場地租借</h1>

<p th:if="${errorMessage}"
   th:text="${errorMessage}"
   style="color:red;"></p>

<form th:action="@{/rentals/save}" th:object="${rental}" method="post">

    <p>
        租借 ID：
        <input type="number" th:field="*{rentalId}" required>
    </p>

    <p>
        場地：
        <select th:field="*{venueId}" required>
            <option value="">請選擇場地</option>
            <option th:each="venue : ${venues}"
                    th:value="${venue.venueId}"
                    th:text="${venue.venueId + ' - ' + venue.venueName}">
            </option>
        </select>
    </p>

    <p>
        會員 ID：
        <input type="number" th:field="*{memberId}" required>
    </p>

    <p>
        活動名稱：
        <input type="text" th:field="*{eventName}" maxlength="50" required>
    </p>

    <p>
        租借日期與時間：
        <input type="datetime-local" th:field="*{rentalDate}" required>
    </p>

    <p>
        參加人數：
        <input type="number" th:field="*{guestCount}" min="1" required>
    </p>

    <p>
        付款 ID：
        <input type="number" th:field="*{paymentId}" required>
    </p>

    <p>
        租借狀態：
        <select th:field="*{rentalStatus}">
            <option value="PENDING">PENDING－待確認</option>
            <option value="CONFIRMED">CONFIRMED－已確認</option>
            <option value="CANCELLED">CANCELLED－已取消</option>
            <option value="COMPLETED">COMPLETED－已完成</option>
        </select>
    </p>

    <button type="submit">儲存</button>
    <a th:href="@{/rentals}">取消</a>

</form>

</body>
</html>
