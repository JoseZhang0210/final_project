<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐廳時段管理</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f5f6f8;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            margin-bottom: 24px;
            padding: 24px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            padding: 10px 16px;
            border: 0;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .btn-save {
            background: #1976d2;
        }

        .btn-clear {
            background: #777;
            margin-left: 8px;
        }

        .btn-edit {
            background: #f57c00;
            margin-right: 6px;
        }

        .btn-delete {
            background: #d32f2f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #263238;
            color: white;
        }

        #message {
            margin-top: 12px;
            font-weight: bold;
        }

        .success {
            color: #2e7d32;
        }

        .error {
            color: #d32f2f;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>餐廳時段管理</h1>

        <div style="margin-bottom: 20px;">
            <button type="button" class="btn-clear" onclick="window.location.href='/restaurant-menu'">
                ← 返回餐廳功能
            </button>
        </div>

        <div class="card">
            <h2 id="formTitle">新增時段</h2>

            <form id="restaurantTimeForm">
                <input type="hidden" id="timeId">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="restaurantId">餐廳 *</label>
                        <select id="restaurantId" required></select>
                    </div>

                    <div class="form-group">
                        <label for="mealType">餐期 *</label>
                        <select id="mealType" required>
                            <option value="早餐">早餐</option>
                            <option value="午餐">午餐</option>
                            <option value="晚餐">晚餐</option>
                            <option value="晚間">晚間</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="openTime">開始時間 *</label>
                        <input type="time" id="openTime" required>
                    </div>

                    <div class="form-group">
                        <label for="closeTime">結束時間 *</label>
                        <input type="time" id="closeTime" required>
                    </div>
                </div>

                <br>

                <button type="submit" class="btn-save">儲存</button>
                <button type="button" class="btn-clear" id="clearButton">
                    清除
                </button>

                <div id="message"></div>
            </form>
        </div>

        <div class="card">
            <h2>時段列表</h2>

            <table>
                <thead>
                    <tr>
                        <th>時段 ID</th>
                        <th>餐廳</th>
                        <th>餐期</th>
                        <th>開始時間</th>
                        <th>結束時間</th>
                        <th>操作</th>
                    </tr>
                </thead>

                <tbody id="timeTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const TIME_API_URL = "/restaurant_times";
        const RESTAURANT_API_URL = "/restaurant";

        let restaurants = [];

        const form = document.getElementById("restaurantTimeForm");
        const formTitle = document.getElementById("formTitle");
        const message = document.getElementById("message");

        const timeId = document.getElementById("timeId");
        const restaurantId = document.getElementById("restaurantId");
        const mealType = document.getElementById("mealType");
        const openTime = document.getElementById("openTime");
        const closeTime = document.getElementById("closeTime");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = type;
        }

        function clearForm() {
            form.reset();
            timeId.value = "";
            formTitle.textContent = "新增時段";
            message.textContent = "";
        }

        async function loadRestaurants() {
            const response = await fetch(RESTAURANT_API_URL);

            if (!response.ok) {
                showMessage("讀取餐廳資料失敗", "error");
                return;
            }

            restaurants = await response.json();

            restaurantId.innerHTML =
                "<option value=''>請選擇餐廳</option>";

            restaurants.forEach(function (restaurant) {
                const option = document.createElement("option");

                option.value = restaurant.restaurantId;
                option.textContent =
                    restaurant.restaurantName
                    + "（ID：" + restaurant.restaurantId + "）";

                restaurantId.appendChild(option);
            });
        }

        function getRestaurantName(id) {
            const restaurant = restaurants.find(function (item) {
                return item.restaurantId === id;
            });

            return restaurant
                ? restaurant.restaurantName
                : "餐廳 ID：" + id;
        }

        async function loadTimes() {
            const response = await fetch(TIME_API_URL);

            if (!response.ok) {
                showMessage("讀取時段資料失敗", "error");
                return;
            }

            const times = await response.json();
            const tableBody =
                document.getElementById("timeTableBody");

            tableBody.innerHTML = "";

            times.forEach(function (time) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${time.timeId}</td>
                    <td>${getRestaurantName(time.restaurantId)}</td>
                    <td>${time.mealType}</td>
                    <td>${time.openTime}</td>
                    <td>${time.closeTime}</td>
                    <td></td>
                `;

                const actionCell = row.lastElementChild;

                const editButton = document.createElement("button");
                editButton.textContent = "修改";
                editButton.className = "btn-edit";
                editButton.addEventListener("click", function () {
                    editTime(time);
                });

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "刪除";
                deleteButton.className = "btn-delete";
                deleteButton.addEventListener("click", function () {
                    deleteTime(time.timeId);
                });

                actionCell.appendChild(editButton);
                actionCell.appendChild(deleteButton);

                tableBody.appendChild(row);
            });
        }

        function editTime(time) {
            timeId.value = time.timeId;
            restaurantId.value = time.restaurantId;
            mealType.value = time.mealType;
            openTime.value = time.openTime.substring(0, 5);
            closeTime.value = time.closeTime.substring(0, 5);

            formTitle.textContent =
                "修改時段 ID：" + time.timeId;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        async function deleteTime(id) {
            if (!confirm("確定要刪除這個時段嗎？")) {
                return;
            }

            const response = await fetch(TIME_API_URL + "/" + id, {
                method: "DELETE"
            });

            if (response.ok) {
                showMessage("時段已刪除", "success");
                clearForm();
                loadTimes();
            } else {
                showMessage("刪除失敗", "error");
            }
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const id = timeId.value;

            const restaurantTime = {
                restaurantId: Number(restaurantId.value),
                mealType: mealType.value,
                openTime: openTime.value,
                closeTime: closeTime.value
            };

            const response = await fetch(
                id === ""
                    ? TIME_API_URL
                    : TIME_API_URL + "/" + id,
                {
                    method: id === "" ? "POST" : "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(restaurantTime)
                }
            );

            if (response.ok) {
                showMessage(
                    id === "" ? "新增成功" : "修改成功",
                    "success"
                );

                clearForm();
                loadTimes();
            } else {
                showMessage("儲存失敗", "error");
            }
        });

        document.getElementById("clearButton")
            .addEventListener("click", clearForm);

        async function initializePage() {
            await loadRestaurants();
            await loadTimes();
        }

        initializePage();
    </script>
</body>

</html>
