<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>場地管理</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
th { background: #f2f2f2; }
.btn { padding: 6px 12px; margin-right: 5px; }
</style>
</head>
<body>

<h1>場地管理</h1>

<a th:href="@{/venues/add}">
    <button class="btn">新增場地</button>
</a>

<a th:href="@{/rentals}">
    <button class="btn">場地租借管理</button>
</a>

<br><br>

<table>
<thead>
<tr>
    <th>場地 ID</th>
    <th>場地名稱</th>
    <th>容納人數</th>
    <th>每日價格</th>
    <th>場地狀態</th>
    <th>操作</th>
</tr>
</thead>

<tbody>
<tr th:each="venue : ${venues}">
    <td th:text="${venue.venueId}"></td>
    <td th:text="${venue.venueName}"></td>
    <td th:text="${venue.capacity}"></td>
    <td th:text="${venue.pricePerDay}"></td>
    <td th:text="${venue.venueStatus}"></td>
    <td>
        <a th:href="@{/venues/edit/{id}(id=${venue.venueId})}">
            <button class="btn">修改</button>
        </a>

        <a th:href="@{/venues/delete/{id}(id=${venue.venueId})}"
           onclick="return confirm('確定要刪除此場地嗎？若已有租借紀錄，資料庫可能會阻止刪除。')">
            <button class="btn">刪除</button>
        </a>
    </td>
</tr>
</tbody>
</table>

</body>
</html>
