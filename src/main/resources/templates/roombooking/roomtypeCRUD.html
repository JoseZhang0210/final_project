<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>訂單管理系統 - Booking Order Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 圖示 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <!-- 頁面標題與新增按鈕 -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h2><i class="fa-solid fa-receipt me-2"></i>訂單與預訂明細管理系統</h2>
        <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#orderModal" onclick="clearForm()">
            <i class="fa-solid fa-plus me-1"></i> 新增訂單
        </button>
    </div>

    <!-- 訊息提示區 -->
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <strong th:text="${errorMsg}">操作失敗！</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>
        <span th:text="${successMsg}">操作成功！</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- 訂單主表與明細表格 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col" class="ps-3">訂單 ID</th>
                            <th scope="col">會員 ID</th>
                            <th scope="col">總金額</th>
                            <th scope="col">訂單狀態</th>
                            <th scope="col">付款 ID</th>
                            <th scope="col">建立時間</th>
                            <th scope="col" class="text-center">操作與明細</th>
                        </tr>
                    </thead>
                    <tbody>
                        <th:block th:each="order : ${orders}">
                            <!-- 主表資料列 -->
                            <tr class="table-light">
                                <td class="ps-3 fw-bold" th:text="${order.bookingOrderId}">1</td>
                                <td th:text="${order.memberid}">1001</td>
                                <td class="text-success fw-bold" th:text="'$' + ${order.bookingTotalPrice}">$3500</td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${order.orderStatus == '已付款' ? 'bg-success' : (order.orderStatus == '已取消' ? 'bg-secondary' : 'bg-warning text-dark')}"
                                          th:text="${order.orderStatus}">已付款</span>
                                </td>
                                <td th:text="${order.paymentId != null ? order.paymentId : '無'}">201</td>
                                <td th:text="${order.createdAt != null ? #dates.format(order.createdAt, 'yyyy-MM-dd HH:mm') : '無'}">2026-03-12 14:00</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-info me-1 text-white" type="button" 
                                            data-bs-toggle="collapse" th:data-bs-target="'#details-' + ${order.bookingOrderId}">
                                        <i class="fa-solid fa-list me-1"></i>明細 (<span th:text="${#lists.size(order.bookings)}">0</span>)
                                    </button>
                                    
                                    <button type="button" class="btn btn-sm btn-outline-primary me-1"
                                            th:data-id="${order.bookingOrderId}"
                                            th:data-member="${order.memberid}"
                                            th:data-price="${order.bookingTotalPrice}"
                                            th:data-status="${order.orderStatus}"
                                            th:data-payment="${order.paymentId}"
                                            onclick="editOrderFromBtn(this)">
                                        <i class="fa-solid fa-pen"></i> 編輯
                                    </button>

                                    <a th:href="@{/bookingorder/delete/{id}(id=${order.bookingOrderId})}" 
                                       class="btn btn-sm btn-outline-danger" 
                                       onclick="return confirm('確定要刪除此訂單及所有相關預訂明細嗎？')">
                                        <i class="fa-solid fa-trash"></i> 刪除
                                    </a>
                                </td>
                            </tr>
                            <!-- 折疊明細資料列 -->
                            <tr>
                                <td colspan="7" class="p-0 border-0">
                                    <div class="collapse bg-white p-3 border-start border-3 border-info" th:id="'details-' + ${order.bookingOrderId}">
                                        <h6 class="fw-bold text-secondary mb-2"><i class="fa-solid fa-bed me-2"></i>預訂房間明細 (Booking Details)</h6>
                                        <table class="table table-sm table-bordered mb-0">
                                            <thead class="table-secondary">
                                                <tr>
                                                    <th>明細 ID</th>
                                                    <th>入住日期</th>
                                                    <th>退房日期</th>
                                                    <th>人數</th>
                                                    <th>房間 ID</th>
                                                    <th>房型 ID</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr th:each="detail : ${order.bookings}">
                                                    <td th:text="${detail.bookingId}">10</td>
                                                    <td th:text="${detail.checkInDate != null ? #dates.format(detail.checkInDate, 'yyyy-MM-dd') : ''}">2026-03-12</td>
                                                    <td th:text="${detail.checkOutDate != null ? #dates.format(detail.checkOutDate, 'yyyy-MM-dd') : ''}">2026-03-14</td>
                                                    <td th:text="${detail.guestNum} + ' 人'">2 人</td>
                                                    <td th:text="${detail.roomId != null ? detail.roomId : '未分配'}">5</td>
                                                    <td th:text="${detail.roomTypeId}">1</td>
                                                </tr>
                                                <tr th:if="${#lists.isEmpty(order.bookings)}">
                                                    <td colspan="6" class="text-center text-muted">此訂單目前無預訂明細資料</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </td>
                            </tr>
                        </th:block>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="7" class="text-center py-4 text-muted">目前暫無訂單資料</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 新增 / 編輯 訂單 Modal -->
<div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/bookingorder/save}" method="post">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">新增訂單</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- 隱藏的主表 ID (關鍵) -->
                    <input type="hidden" id="bookingOrderId" name="bookingOrderId">

                    <!-- 主表資訊區 -->
                    <div class="fw-bold border-bottom pb-2 mb-3 text-primary"><i class="fa-solid fa-file-invoice me-1"></i> 訂單基本資訊</div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="memberId" class="form-label">會員 ID <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="memberId" name="memberid" required placeholder="例如：1001">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="totalPrice" class="form-label">總金額 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="totalPrice" name="bookingTotalPrice" min="0" required placeholder="3500">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="orderStatus" class="form-label">訂單狀態</label>
                            <select class="form-select" id="orderStatus" name="orderStatus">
                                <option value="未付款">未付款</option>
                                <option value="已付款">已付款</option>
                                <option value="已完成">已完成</option>
                                <option value="已取消">已取消</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="paymentId" class="form-label">付款 ID (無則留空)</label>
                            <input type="number" class="form-control" id="paymentId" name="paymentId" placeholder="可留空">
                        </div>
                    </div>

                    <!-- 明細表動態新增區 -->
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3 mt-3 text-primary">
                        <span class="fw-bold"><i class="fa-solid fa-hotel me-1"></i> 預訂房間明細</span>
                        <button type="button" class="btn btn-sm btn-outline-success" onclick="addBookingRow()">
                            <i class="fa-solid fa-plus me-1"></i> 新增一筆房型明細
                        </button>
                    </div>

                    <div id="bookingListContainer"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">儲存資料</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let detailIndex = 0;

    // 清空 Modal (開啟新增視窗)
    function clearForm() {
        document.getElementById('modalTitle').innerText = '新增訂單';
        document.getElementById('bookingOrderId').value = ''; // 設為空白讓 JPA 生成主鍵
        document.getElementById('memberId').value = '';
        document.getElementById('totalPrice').value = '';
        document.getElementById('orderStatus').value = '未付款';
        document.getElementById('paymentId').value = '';
        
        document.getElementById('bookingListContainer').innerHTML = '';
        detailIndex = 0;
        addBookingRow();
    }

    // 動態新增一列 Booking 明細
    function addBookingRow() {
        const container = document.getElementById('bookingListContainer');
        const rowDiv = document.createElement('div');
        rowDiv.className = 'card bg-light p-3 mb-2 border position-relative';
        rowDiv.id = `bookingRow_${detailIndex}`;

        rowDiv.innerHTML = `
            <button type="button" class="btn-close position-absolute top-0 end-0 m-2" onclick="removeBookingRow(${detailIndex})" aria-label="Remove"></button>
            <div class="row g-2">
                <div class="col-md-3">
                    <label class="form-label small">入住日期 <span class="text-danger">*</span></label>
                    <input type="date" class="form-control form-control-sm" name="bookings[${detailIndex}].checkInDate" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">退房日期 <span class="text-danger">*</span></label>
                    <input type="date" class="form-control form-control-sm" name="bookings[${detailIndex}].checkOutDate" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">人數 <span class="text-danger">*</span></label>
                    <input type="number" class="form-control form-control-sm" name="bookings[${detailIndex}].guestNum" min="1" value="1" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">房型 ID <span class="text-danger">*</span></label>
                    <input type="number" class="form-control form-control-sm" name="bookings[${detailIndex}].roomTypeId" required placeholder="例如: 1">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">房間 ID (可空)</label>
                    <input type="number" class="form-control form-control-sm" name="bookings[${detailIndex}].roomId" placeholder="可留空">
                </div>
            </div>
        `;
        container.appendChild(rowDiv);
        detailIndex++;
    }

    // 移除指定的明細列
    function removeBookingRow(index) {
        const row = document.getElementById(`bookingRow_${index}`);
        if (row) {
            row.remove();
        }
    }

    // 代入主表資料至 Modal 進行編輯
    function editOrderFromBtn(btn) {
        const id = btn.getAttribute('data-id');
        const memberId = btn.getAttribute('data-member');
        const price = btn.getAttribute('data-price');
        const status = btn.getAttribute('data-status');
        const payId = btn.getAttribute('data-payment');

        document.getElementById('modalTitle').innerText = '編輯訂單主表';
        document.getElementById('bookingOrderId').value = id;
        document.getElementById('memberId').value = memberId;
        document.getElementById('totalPrice').value = price;
        document.getElementById('orderStatus').value = status;
        document.getElementById('paymentId').value = (payId && payId !== 'null') ? payId : '';

        document.getElementById('bookingListContainer').innerHTML = 
            '<p class="text-muted small mb-0">編輯模式僅提供修改主表資訊。若需增刪子明細，請刪除重建立或另透過明細介面操作。</p>';

        var modal = new bootstrap.Modal(document.getElementById('orderModal'));
        modal.show();
    }
</script>
</body>
</html>
