spring.application.name=HotelProject
server.port=8082

#Spring Security
#spring.security.user.name=user
#spring.security.user.password=1234


#SQL Server DataSource Setting
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=finalproject;encrypt=true;trustServerCertificate=true
spring.datasource.username=hotel_app
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


#Spring Data JPA Setting
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
