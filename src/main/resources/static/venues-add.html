<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增場地 - SereneStay 飯店</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-actions {
            margin-top: 30px;
        }

        .btn {
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">SereneStay 飯店管理系統</h1>
            <ul class="nav-menu">
                <li><a href="/">首頁</a></li>
                <li><a href="/products.html">產品管理</a></li>
                <li><a href="/venues.html">場地管理</a></li>
                <li><a href="/rentals.html">租賃管理</a></li>
                <li><a href="/room-types.html">房型管理</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-container">
        <h1>新增場地</h1>

        <form id="venueForm">
            <div class="form-group">
                <label for="venueId">場地 ID *</label>
                <input type="number" id="venueId" name="venueId" required>
            </div>

            <div class="form-group">
                <label for="venueName">場地名稱 *</label>
                <input type="text" id="venueName" name="venueName" maxlength="50" required>
            </div>

            <div class="form-group">
                <label for="capacity">容納人數 *</label>
                <input type="number" id="capacity" name="capacity" min="1" required>
            </div>

            <div class="form-group">
                <label for="pricePerDay">每日租借價格 *</label>
                <input type="number" id="pricePerDay" name="pricePerDay" min="0" required>
            </div>

            <div class="form-group">
                <label for="venueStatus">場地狀態 *</label>
                <select id="venueStatus" name="venueStatus" required>
                    <option value="AVAILABLE">AVAILABLE - 可租借</option>
                    <option value="MAINTENANCE">MAINTENANCE - 維修中</option>
                    <option value="DISABLED">DISABLED - 停止使用</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">儲存</button>
                <a href="/venues.html" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 SereneStay 飯店. 所有權利保留。</p>
    </footer>

    <script type="module">
        import { createVenue, isSuccess } from '/js/api.js';

        document.getElementById('venueForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = {
                venueId: parseInt(document.getElementById('venueId').value),
                venueName: document.getElementById('venueName').value,
                capacity: parseInt(document.getElementById('capacity').value),
                pricePerDay: parseInt(document.getElementById('pricePerDay').value),
                venueStatus: document.getElementById('venueStatus').value
            };

            try {
                const response = await createVenue(formData);
                if (isSuccess(response)) {
                    alert('場地已新增');
                    window.location.href = '/venues.html';
                } else {
                    alert('新增失敗: ' + response.message);
                }
            } catch (error) {
                alert('新增出錯: ' + error.message);
            }
        });
    </script>
</body>

</html>
