<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房型管理系統 - Room Type Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 圖示 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">
        <!-- 頁面標題與按鈕區 -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h2><i class="fa-solid fa-bed me-2"></i>房型資料管理系統</h2>
            <div>
                <!-- 返回首頁按鈕 -->
                <a href="/" class="btn btn-outline-secondary me-2">
                    <i class="fa-solid fa-home me-1"></i> 返回首頁
                </a>
                <!-- 新增房型按鈕 -->
                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#roomTypeModal"
                    onclick="clearForm()">
                    <i class="fa-solid fa-plus me-1"></i> 新增房型
                </button>
            </div>
        </div>

        <!-- 訊息提示區 (預設隱藏) -->
        <div id="alertError" class="alert alert-danger alert-dismissible fade show shadow-sm d-none" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span id="alertErrorMsg">操作失敗！</span>
            <button type="button" class="btn-close" onclick="hideAlert('alertError')"></button>
        </div>
        <div id="alertSuccess" class="alert alert-success alert-dismissible fade show shadow-sm d-none" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span id="alertSuccessMsg">操作成功！</span>
            <button type="button" class="btn-close" onclick="hideAlert('alertSuccess')"></button>
        </div>

        <!-- 🔍 搜尋與篩選區塊 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="searchForm" onsubmit="handleSearch(event)" class="row g-3 align-items-center">
                    <!-- 關鍵字搜尋 -->
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" class="form-control" id="searchInput" placeholder="搜尋房型名稱、床型或描述...">
                        </div>
                    </div>
                    <!-- 容納人數篩選 -->
                    <div class="col-md-3">
                        <select class="form-select" id="capacityFilter">
                            <option value="">所有人數上限</option>
                            <option value="1">1 人</option>
                            <option value="2">2 人</option>
                            <option value="4">4 人</option>
                            <option value="6">6 人以上</option>
                        </select>
                    </div>
                    <!-- 按鈕組 -->
                    <div class="col-md-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-fill">
                            <i class="fa-solid fa-search me-1"></i> 搜尋
                        </button>
                        <button type="button" class="btn btn-outline-secondary" onclick="resetSearch()">
                            <i class="fa-solid fa-rotate-left me-1"></i> 重設
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 房型列表表格 -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" class="ps-3">房型 ID</th>
                                <th scope="col">房型名稱</th>
                                <th scope="col">床型</th>
                                <th scope="col">每晚價格</th>
                                <th scope="col">容納人數</th>
                                <th scope="col">圖片 ID</th>
                                <th scope="col">描述</th>
                                <th scope="col" class="text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="roomTypeTableBody">
                            <tr>
                                <td colspan="8" class="text-center py-4 text-muted">載入資料中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增 / 編輯 房型 Modal -->
    <div class="modal fade" id="roomTypeModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <form id="roomTypeForm" onsubmit="saveRoomType(event)">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalTitle">新增房型</h5>

                        <!-- 🔒 鎖頭切換按鈕 -->
                        <div class="ms-auto me-2">
                            <button type="button" id="lockToggleBtn" class="btn btn-warning btn-sm fw-bold"
                                onclick="toggleLock()">
                                <i class="fa-solid fa-lock me-1" id="lockIcon"></i>
                                <span id="lockText">點擊解鎖</span>
                            </button>
                        </div>

                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="roomTypeId" name="roomTypeId">

                        <div
                            class="fw-bold border-bottom pb-2 mb-3 text-primary d-flex justify-content-between align-items-center">
                            <span><i class="fa-solid fa-door-open me-1"></i> 房型詳細資訊</span>
                            <small id="readonlyHint" class="text-muted fw-normal d-none">
                                <i class="fa-solid fa-circle-info me-1"></i>目前為唯讀狀態，點擊右上角鎖頭即可編輯
                            </small>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="typeName" class="form-label">房型名稱 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control editable-field" id="typeName" name="typeName"
                                    required placeholder="例如：豪華套房">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="bedType" class="form-label">床型 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control editable-field" id="bedType" name="bedType"
                                    required placeholder="例如：一大床 / 兩單床">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="pricePerNight" class="form-label">每晚價格 <span
                                        class="text-danger">*</span></label>
                                <input type="number" class="form-control editable-field" id="pricePerNight"
                                    name="pricePerNight" min="0" step="100" required placeholder="例如：3200">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="capacity" class="form-label">容納人數 <span class="text-danger">*</span></label>
                                <input type="number" class="form-control editable-field" id="capacity" name="capacity"
                                    min="1" required placeholder="例如：2">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="imageId" class="form-label">圖片 ID (無則留空)</label>
                                <input type="number" class="form-control editable-field" id="imageId" name="imageId"
                                    placeholder="可留空">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">房型描述</label>
                            <textarea class="form-control editable-field" id="description" name="description" rows="3"
                                style="resize: none;" placeholder="請輸入關於此房型的簡短描述..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" id="btnSubmit" class="btn btn-primary">儲存資料</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 🚨 最外層：防止誤觸刪除的二次確認 Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteModalTitle">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i>確認刪除房型
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="fs-5 mb-2">確定要刪除以下房型嗎？</p>
                    <div class="alert alert-warning d-inline-block text-start px-4 py-2 mb-3">
                        <strong id="deleteTargetInfo">房型資料載入中...</strong>
                    </div>
                    <p class="text-danger small mb-0"><i class="fa-solid fa-circle-info me-1"></i>此操作無法復原，請謹慎確認！</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger px-4" onclick="executeDelete()">
                        <i class="fa-solid fa-trash me-1"></i>確認刪除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = '/api/roomtypes';
        let modalInstance = null;
        let deleteModalInstance = null;
        let roomTypeList = []; // 快取完整房型資料陣列
        let isLocked = true;   // 狀態控制：true = 唯讀, false = 可編輯
        let pendingDeleteId = null; // 當前準備刪除的房型 ID

        document.addEventListener('DOMContentLoaded', () => {
            modalInstance = new bootstrap.Modal(document.getElementById('roomTypeModal'));
            deleteModalInstance = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
            loadRoomTypes();
        });

        // 1. 取得所有房型資料 (GET)
        async function loadRoomTypes() {
            try {
                hideAlert('alertError');
                const response = await fetch(API_BASE_URL);
                if (!response.ok) throw new Error('無法取得房型列表');
                roomTypeList = await response.json();

                applyFilters();
            } catch (err) {
                showAlert('alertError', err.message);
            }
        }

        // 2. 搜尋與篩選邏輯
        function applyFilters() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectedCapacity = document.getElementById('capacityFilter').value;

            const filteredList = roomTypeList.filter(item => {
                const matchKeyword = !keyword ||
                    (item.typeName && item.typeName.toLowerCase().includes(keyword)) ||
                    (item.bedType && item.bedType.toLowerCase().includes(keyword)) ||
                    (item.description && item.description.toLowerCase().includes(keyword)) ||
                    String(item.roomTypeId).includes(keyword);

                let matchCapacity = true;
                if (selectedCapacity) {
                    const cap = parseInt(selectedCapacity);
                    if (cap === 6) {
                        matchCapacity = item.capacity >= 6;
                    } else {
                        matchCapacity = item.capacity === cap;
                    }
                }

                return matchKeyword && matchCapacity;
            });

            renderTable(filteredList);
        }

        function handleSearch(e) {
            if (e) e.preventDefault();
            applyFilters();
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('capacityFilter').value = '';
            renderTable(roomTypeList);
        }

        // 渲染表格資料
        function renderTable(list) {
            const tbody = document.getElementById('roomTypeTableBody');
            if (!list || list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">沒有符合條件的房型資料</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(item => `
                <tr>
                    <td class="ps-3 fw-bold">${item.roomTypeId}</td>
                    <td class="fw-bold text-primary">${escapeHtml(item.typeName)}</td>
                    <td>${escapeHtml(item.bedType)}</td>
                    <td class="text-success fw-bold">$${item.pricePerNight}</td>
                    <td>${item.capacity} 人</td>
                    <td>${item.imageId ? item.imageId : '無'}</td>
                    <td class="text-muted text-truncate" style="max-width: 200px;">${escapeHtml(item.description || '')}</td>
                    <td class="text-center">
                        <button type="button" class="btn btn-sm btn-outline-primary me-1" onclick="onEditBtnClick(${item.roomTypeId})">
                            <i class="fa-solid fa-pen"></i> 編輯
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="openDeleteConfirm(${item.roomTypeId})">
                            <i class="fa-solid fa-trash"></i> 刪除
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 🔒 控制唯讀 / 可編輯狀態
        function setLockState(locked) {
            isLocked = locked;
            const fields = document.querySelectorAll('.editable-field');
            const lockIcon = document.getElementById('lockIcon');
            const lockText = document.getElementById('lockText');
            const lockBtn = document.getElementById('lockToggleBtn');
            const submitBtn = document.getElementById('btnSubmit');
            const hint = document.getElementById('readonlyHint');

            if (isLocked) {
                fields.forEach(field => field.setAttribute('readonly', 'readonly'));
                lockIcon.className = 'fa-solid fa-lock me-1';
                lockText.innerText = '點擊解鎖';
                lockBtn.className = 'btn btn-warning btn-sm fw-bold';
                submitBtn.classList.add('d-none');
                hint.classList.remove('d-none');
            } else {
                fields.forEach(field => field.removeAttribute('readonly'));
                lockIcon.className = 'fa-solid fa-lock-open me-1';
                lockText.innerText = '編輯中';
                lockBtn.className = 'btn btn-success btn-sm fw-bold';
                submitBtn.classList.remove('d-none');
                hint.classList.add('d-none');
            }
        }

        function toggleLock() {
            setLockState(!isLocked);
        }

        // 3. 新增 / 編輯房型 (POST / PUT)
        async function saveRoomType(e) {
            e.preventDefault();
            if (isLocked) return;

            const id = document.getElementById('roomTypeId').value;
            const payload = {
                roomTypeId: id ? parseInt(id) : null,
                typeName: document.getElementById('typeName').value,
                bedType: document.getElementById('bedType').value,
                pricePerNight: parseFloat(document.getElementById('pricePerNight').value),
                capacity: parseInt(document.getElementById('capacity').value),
                imageId: document.getElementById('imageId').value ? parseInt(document.getElementById('imageId').value) : null,
                description: document.getElementById('description').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE_URL}/${id}` : API_BASE_URL;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || '儲存失敗');
                }

                modalInstance.hide();
                showAlert('alertSuccess', id ? '房型更新成功！' : '新增房型成功！');
                loadRoomTypes();
            } catch (err) {
                showAlert('alertError', err.message);
            }
        }

        // 4. 開啟刪除二次確認 Modal
        function openDeleteConfirm(id) {
            const item = roomTypeList.find(r => r.roomTypeId === id);
            if (!item) return;

            pendingDeleteId = id;
            document.getElementById('deleteTargetInfo').innerText = `[ID: ${item.roomTypeId}] ${item.typeName}`;
            deleteModalInstance.show();
        }

        // 5. 執行刪除房型 (DELETE)
        async function executeDelete() {
            if (!pendingDeleteId) return;

            try {
                const response = await fetch(`${API_BASE_URL}/${pendingDeleteId}`, { method: 'DELETE' });
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || '刪除失敗');
                }

                deleteModalInstance.hide();
                showAlert('alertSuccess', '房型已成功刪除！');
                pendingDeleteId = null;
                loadRoomTypes();
            } catch (err) {
                deleteModalInstance.hide();
                showAlert('alertError', err.message);
            }
        }

        // 清空表單
        function clearForm() {
            document.getElementById('modalTitle').innerText = '新增房型';
            document.getElementById('roomTypeForm').reset();
            document.getElementById('roomTypeId').value = '';
            document.getElementById('capacity').value = '2';

            document.getElementById('lockToggleBtn').classList.add('d-none');
            setLockState(false);
        }

        // 按下編輯按鈕觸發
        function onEditBtnClick(id) {
            const item = roomTypeList.find(r => r.roomTypeId === id);
            if (item) editRoomType(item);
        }

        // 填入資料並開啟
        function editRoomType(item) {
            document.getElementById('modalTitle').innerText = '查看 / 編輯房型資料';
            document.getElementById('roomTypeId').value = item.roomTypeId;
            document.getElementById('typeName').value = item.typeName || '';
            document.getElementById('bedType').value = item.bedType || '';
            document.getElementById('pricePerNight').value = item.pricePerNight || 0;
            document.getElementById('capacity').value = item.capacity || 1;
            document.getElementById('imageId').value = item.imageId || '';
            document.getElementById('description').value = item.description || '';

            document.getElementById('lockToggleBtn').classList.remove('d-none');
            setLockState(true);

            modalInstance.show();
        }

        // 提示訊息控制
        function showAlert(id, msg) {
            const alertElem = document.getElementById(id);
            const msgElem = document.getElementById(id + 'Msg');
            if (msgElem) msgElem.innerText = msg;
            alertElem.classList.remove('d-none');
        }

        function hideAlert(id) {
            document.getElementById(id).classList.add('d-none');
        }

        // XSS 防護
        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }
    </script>
</body>

</html>
