<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>圖片資料管理系統</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome 圖示 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        min-height: 100vh;
      }
    </style>
  </head>

  <body>
    <!-- 頂部頁面標題區 -->
    <div
      class="container-fluid px-4 py-3 bg-white border-bottom shadow-sm mb-4"
    >
      <div class="d-flex align-items-center justify-content-between">
        <h2 class="fw-bold mb-0 text-dark">
          <i class="fa-solid fa-image me-2"></i>圖片資料管理系統
        </h2>
        <div class="d-flex gap-2">
          <a href="/" class="btn btn-outline-secondary">
            <i class="fa-solid fa-house me-1"></i> 返回首頁
          </a>
          <button
            type="button"
            class="btn btn-success"
            data-bs-toggle="modal"
            data-bs-target="#imageModal"
            onclick="clearForm()"
          >
            <i class="fa-solid fa-plus me-1"></i> 新增圖片
          </button>
        </div>
      </div>
    </div>

    <!-- 主要內容區域 -->
    <div class="container-fluid px-4 pb-5">
      <!-- 訊息提示區 -->
      <div
        id="alertError"
        class="alert alert-danger alert-dismissible fade show shadow-sm d-none mb-3"
        role="alert"
      >
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <span id="alertErrorMsg">操作失敗！</span>
        <button
          type="button"
          class="btn-close"
          onclick="hideAlert('alertError')"
        ></button>
      </div>
      <div
        id="alertSuccess"
        class="alert alert-success alert-dismissible fade show shadow-sm d-none mb-3"
        role="alert"
      >
        <i class="fa-solid fa-circle-check me-2"></i>
        <span id="alertSuccessMsg">操作成功！</span>
        <button
          type="button"
          class="btn-close"
          onclick="hideAlert('alertSuccess')"
        ></button>
      </div>

      <!-- 🔍 搜尋與篩選列 -->
      <div class="card shadow-sm mb-4 border-0">
        <div class="card-body p-3">
          <form
            id="searchForm"
            onsubmit="handleSearch(event)"
            class="row g-3 align-items-center"
          >
            <div class="col-md-9">
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0">
                  <i class="fa-solid fa-magnifying-glass text-muted"></i>
                </span>
                <input
                  type="text"
                  class="form-control border-start-0 ps-0"
                  id="searchInput"
                  placeholder="搜尋圖片 ID、路徑或描述..."
                />
              </div>
            </div>
            <div class="col-md-3 d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-fill">
                <i class="fa-solid fa-search me-1"></i> 搜尋
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="resetSearch()"
              >
                <i class="fa-solid fa-rotate-left me-1"></i> 重設
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- 資料表格 -->
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th scope="col" class="ps-3" style="width: 100px">圖片 ID</th>
                  <th scope="col" style="width: 100px">預覽</th>
                  <th scope="col">儲存路徑 (Path)</th>
                  <th scope="col">圖片描述 (Image Description)</th>
                  <th scope="col" class="text-center" style="width: 180px">
                    操作
                  </th>
                </tr>
              </thead>
              <tbody id="imageTableBody">
                <tr>
                  <td colspan="5" class="text-center py-4 text-muted">
                    載入資料中...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- 新增 / 編輯 圖片 Modal -->
    <div
      class="modal fade"
      id="imageModal"
      tabindex="-1"
      aria-labelledby="modalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <form
            id="imageForm"
            onsubmit="saveImage(event)"
            enctype="multipart/form-data"
          >
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title" id="modalTitle">圖片設定</h5>
              <div class="ms-auto me-2">
                <button
                  type="button"
                  id="lockToggleBtn"
                  class="btn btn-warning btn-sm fw-bold"
                  onclick="toggleLock()"
                >
                  <i class="fa-solid fa-lock me-1" id="lockIcon"></i>
                  <span id="lockText">點擊解鎖</span>
                </button>
              </div>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <!-- 隱藏欄位：圖片 ID 與已選取的 static 路徑 -->
              <input type="hidden" id="imageId" name="imageId" />
              <input
                type="hidden"
                id="selectedStaticPath"
                name="selectedStaticPath"
              />

              <!-- 圖片預覽區 -->
              <div class="mb-3 text-center d-none" id="previewContainer">
                <p class="form-label text-start fw-bold">當前圖片預覽：</p>
                <img
                  id="imagePreview"
                  src=""
                  alt="預覽"
                  class="img-thumbnail shadow-sm"
                  style="max-height: 180px; object-fit: contain"
                />
              </div>

              <!-- 模式 1：選擇專案內部預設圖片 (static) -->
              <div class="mb-3">
                <label for="existingImageSelect" class="form-label fw-bold">
                  <i class="fa-solid fa-folder-open text-primary me-1"></i>
                  選擇專案預設圖片 (static)：
                </label>
                <select
                  id="existingImageSelect"
                  class="form-select editable-field"
                  onchange="onSelectExistingImage(this)"
                >
                  <option value="">
                    -- 請選擇預設圖片 (或下方上傳新圖) --
                  </option>
                  <option value="/images/room/roomtype.1.jpg">
                    房型預設圖 1 (/images/room/roomtype.1.jpg)
                  </option>
                  <option value="/images/room/roomtype.2.jpg">
                    房型預設圖 2 (/images/room/roomtype.2.jpg)
                  </option>
                  <option value="/images/room/roomtype.3.jpg">
                    房型預設圖 3 (/images/room/roomtype.3.jpg)
                  </option>
                  <option value="/images/room/roomtype.4.jpg">
                    房型預設圖 4 (/images/room/roomtype.4.jpg)
                  </option>
                  <option value="/images/room/roomtype.5.jpg">
                    房型預設圖 5 (/images/room/roomtype.5.jpg)
                  </option>
                </select>
              </div>

              <div class="text-center my-3 text-muted small fw-bold">
                - 或 -
              </div>

              <!-- 模式 2：上傳實體圖片檔案 (uploads) -->
              <div class="mb-3">
                <label for="fileInput" class="form-label fw-bold">
                  <i class="fa-solid fa-upload text-success me-1"></i>
                  動態上傳新圖片檔案：
                </label>
                <input
                  type="file"
                  class="form-control editable-field"
                  id="fileInput"
                  name="file"
                  accept="image/*"
                  onchange="handleFileSelect(event)"
                />
                <div class="form-text">
                  檔案將上傳至伺服器目錄，並自動設定相對路徑。
                </div>
              </div>

              <!-- 圖片描述 -->
              <div class="mb-3">
                <label for="imageDesc" class="form-label fw-bold">
                  圖片描述 (Image Description)
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control editable-field"
                  id="imageDesc"
                  name="imageDesc"
                  required
                  placeholder="例如：豪華雙人房景觀"
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                取消
              </button>
              <button type="submit" id="btnSubmit" class="btn btn-primary">
                儲存資料
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 刪除確認 Modal -->
    <div
      class="modal fade"
      id="deleteConfirmModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title">
              <i class="fa-solid fa-triangle-exclamation me-2"></i>確認刪除
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body text-center py-4">
            <p class="fs-5 mb-2">確定要刪除該圖片資料嗎？</p>
            <div
              class="alert alert-warning d-inline-block text-start px-4 py-2 mb-3"
            >
              <strong id="deleteTargetInfo">載入中...</strong>
            </div>
          </div>
          <div class="modal-footer justify-content-center">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              取消
            </button>
            <button
              type="button"
              class="btn btn-danger"
              onclick="executeDelete()"
            >
              <i class="fa-solid fa-trash me-1"></i>確認刪除
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入獨立邏輯檔案 -->
    <script src="/js/room.js"></script>
  </body>
</html>
