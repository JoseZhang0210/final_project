<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房間管理系統 - Room Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 圖示 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">
        <!-- 頁面標題與按鈕區 -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h2><i class="fa-solid fa-door-closed me-2"></i>房間資料管理系統</h2>
            <div>
                <!-- 返回首頁按鈕 -->
                <a href="/" class="btn btn-outline-secondary me-2">
                    <i class="fa-solid fa-home me-1"></i> 返回首頁
                </a>
                <!-- 新增房間按鈕 -->
                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#roomModal"
                    onclick="clearForm()">
                    <i class="fa-solid fa-plus me-1"></i> 新增房間
                </button>
            </div>
        </div>

        <!-- 訊息提示區 (預設隱藏) -->
        <div id="alertError" class="alert alert-danger alert-dismissible fade show shadow-sm d-none" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span id="alertErrorMsg">操作失敗！</span>
            <button type="button" class="btn-close" onclick="hideAlert('alertError')"></button>
        </div>
        <div id="alertSuccess" class="alert alert-success alert-dismissible fade show shadow-sm d-none" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span id="alertSuccessMsg">操作成功！</span>
            <button type="button" class="btn-close" onclick="hideAlert('alertSuccess')"></button>
        </div>

        <!-- 🔍 搜尋與篩選區塊 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="searchForm" onsubmit="handleSearch(event)" class="row g-3 align-items-center">
                    <!-- 關鍵字搜尋 (房號 / ID) -->
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" class="form-control" id="searchInput" placeholder="搜尋房號或房間 ID...">
                        </div>
                    </div>
                    <!-- 樓層篩選 -->
                    <div class="col-md-2">
                        <select class="form-select" id="floorFilter">
                            <option value="">所有樓層</option>
                            <option value="5">5 樓</option>
                            <option value="6">6 樓</option>
                            <option value="7">7 樓</option>
                            <option value="8">8 樓</option>
                            <option value="9">9 樓</option>
                            <option value="10">10 樓</option>
                        </select>
                    </div>
                    <!-- 房間狀態篩選 -->
                    <div class="col-md-2">
                        <select class="form-select" id="roomStatusFilter">
                            <option value="">所有房間狀態</option>
                            <option value="可預訂">可預訂</option>
                            <option value="已預訂">已預訂</option>
                            <option value="已入住">已入住</option>
                            <option value="退房待清潔">退房待清潔</option>
                            <option value="清潔中">清潔中</option>
                        </select>
                    </div>
                    <!-- 按鈕組 -->
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-fill">
                            <i class="fa-solid fa-search me-1"></i> 搜尋
                        </button>
                        <button type="button" class="btn btn-outline-secondary" onclick="resetSearch()">
                            <i class="fa-solid fa-rotate-left me-1"></i> 重設
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 房間列表表格 -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" class="ps-3">房間 ID</th>
                                <th scope="col">房號</th>
                                <th scope="col">房型 ID</th>
                                <th scope="col">樓層</th>
                                <th scope="col">房間狀態 (Room Status)</th>
                                <th scope="col" class="text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="roomTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">載入資料中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增 / 編輯 房間 Modal -->
    <div class="modal fade" id="roomModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <form id="roomForm" onsubmit="saveRoom(event)">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalTitle">新增房間</h5>

                        <!-- 🔒 鎖頭切換按鈕 -->
                        <div class="ms-auto me-2">
                            <button type="button" id="lockToggleBtn" class="btn btn-warning btn-sm fw-bold"
                                onclick="toggleLock()">
                                <i class="fa-solid fa-lock me-1" id="lockIcon"></i>
                                <span id="lockText">點擊解鎖</span>
                            </button>
                        </div>

                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="roomId" name="roomId">

                        <div
                            class="fw-bold border-bottom pb-2 mb-3 text-primary d-flex justify-content-between align-items-center">
                            <span><i class="fa-solid fa-door-open me-1"></i> 房間詳細資訊</span>
                            <small id="readonlyHint" class="text-muted fw-normal d-none">
                                <i class="fa-solid fa-circle-info me-1"></i>目前為唯讀狀態，點擊右上角鎖頭即可編輯
                            </small>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="roomNumber" class="form-label">房號 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control editable-field" id="roomNumber" name="roomNumber"
                                    required placeholder="例如：10501">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="roomTypeId" class="form-label">房型 ID <span
                                        class="text-danger">*</span></label>
                                <input type="number" class="form-control editable-field" id="roomTypeId"
                                    name="roomTypeId" required placeholder="例如：1">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="floor" class="form-label">樓層 <span class="text-danger">*</span></label>
                                <input type="number" class="form-control editable-field" id="floor" name="floor" min="1"
                                    max="100" required placeholder="例如：5">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="roomStatus" class="form-label">房間狀態 (Room Status) <span
                                        class="text-danger">*</span></label>
                                <select class="form-select editable-field" id="roomStatus" name="roomStatus" required>
                                    <option value="可預訂">1. 可預訂</option>
                                    <option value="已預訂">2. 已預訂</option>
                                    <option value="已入住">3. 已入住</option>
                                    <option value="退房待清潔">4. 退房待清潔</option>
                                    <option value="清潔中">5. 清潔中</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" id="btnSubmit" class="btn btn-primary">儲存資料</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 🚨 二次確認刪除 Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteModalTitle">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i>確認刪除房間
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="fs-5 mb-2">確定要刪除以下房間嗎？</p>
                    <div class="alert alert-warning d-inline-block text-start px-4 py-2 mb-3">
                        <strong id="deleteTargetInfo">房間資料載入中...</strong>
                    </div>
                    <p class="text-danger small mb-0"><i class="fa-solid fa-circle-info me-1"></i>此操作無法復原，請謹慎確認！</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger px-4" onclick="executeDelete()">
                        <i class="fa-solid fa-trash me-1"></i>確認刪除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = '/api/rooms';
        let modalInstance = null;
        let deleteModalInstance = null;
        let roomList = [];     // 快取完整房間資料陣列
        let isLocked = true;   // 狀態控制：true = 唯讀, false = 可編輯
        let pendingDeleteId = null; // 當前準備刪除的房間 ID

        document.addEventListener('DOMContentLoaded', () => {
            modalInstance = new bootstrap.Modal(document.getElementById('roomModal'));
            deleteModalInstance = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
            loadRooms();
        });

        // 1. 取得所有房間資料 (GET)
        async function loadRooms() {
            try {
                hideAlert('alertError');
                const response = await fetch(API_BASE_URL);
                if (!response.ok) throw new Error('無法取得房間列表');
                roomList = await response.json();

                applyFilters();
            } catch (err) {
                showAlert('alertError', err.message);
            }
        }

        // 2. 搜尋與篩選邏輯
        function applyFilters() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectedFloor = document.getElementById('floorFilter').value;
            const selectedRoomStatus = document.getElementById('roomStatusFilter').value;

            const filteredList = roomList.filter(item => {
                const matchKeyword = !keyword ||
                    String(item.roomNumber).toLowerCase().includes(keyword) ||
                    String(item.roomId).includes(keyword);

                const matchFloor = !selectedFloor || item.floor === parseInt(selectedFloor);
                const matchRoomStatus = !selectedRoomStatus || item.roomStatus === selectedRoomStatus;

                return matchKeyword && matchFloor && matchRoomStatus;
            });

            renderTable(filteredList);
        }

        function handleSearch(e) {
            if (e) e.preventDefault();
            applyFilters();
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('floorFilter').value = '';
            document.getElementById('roomStatusFilter').value = '';
            renderTable(roomList);
        }

        // 渲染表格資料
        function renderTable(list) {
            const tbody = document.getElementById('roomTableBody');
            if (!list || list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">沒有符合條件的房間資料</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(item => `
                <tr>
                    <td class="ps-3 fw-bold">${item.roomId}</td>
                    <td class="fw-bold text-primary">${escapeHtml(item.roomNumber)}</td>
                    <td><span class="badge bg-secondary">型號 ${item.roomTypeId}</span></td>
                    <td>${item.floor} 樓</td>
                    <td>${getRoomStatusBadge(item.roomStatus)}</td>
                    <td class="text-center">
                        <button type="button" class="btn btn-sm btn-outline-primary me-1" onclick="onEditBtnClick(${item.roomId})">
                            <i class="fa-solid fa-pen"></i> 編輯
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="openDeleteConfirm(${item.roomId})">
                            <i class="fa-solid fa-trash"></i> 刪除
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 房間狀態 Badge 顏色轉換
        function getRoomStatusBadge(status) {
            switch (status) {
                case '可預訂': return `<span class="badge bg-success">可預訂</span>`;
                case '已預訂': return `<span class="badge bg-primary">已預訂</span>`;
                case '已入住': return `<span class="badge bg-info text-dark">已入住</span>`;
                case '退房待清潔': return `<span class="badge bg-warning text-dark">退房待清潔</span>`;
                case '清潔中': return `<span class="badge bg-secondary">清潔中</span>`;
                default: return `<span class="badge bg-light text-dark border">${escapeHtml(status || '未設定')}</span>`;
            }
        }

        // 🔒 控制唯讀 / 可編輯狀態
        function setLockState(locked) {
            isLocked = locked;
            const fields = document.querySelectorAll('.editable-field');
            const lockIcon = document.getElementById('lockIcon');
            const lockText = document.getElementById('lockText');
            const lockBtn = document.getElementById('lockToggleBtn');
            const submitBtn = document.getElementById('btnSubmit');
            const hint = document.getElementById('readonlyHint');

            if (isLocked) {
                fields.forEach(field => {
                    if (field.tagName === 'SELECT') {
                        field.setAttribute('disabled', 'disabled');
                    } else {
                        field.setAttribute('readonly', 'readonly');
                    }
                });
                lockIcon.className = 'fa-solid fa-lock me-1';
                lockText.innerText = '點擊解鎖';
                lockBtn.className = 'btn btn-warning btn-sm fw-bold';
                submitBtn.classList.add('d-none');
                hint.classList.remove('d-none');
            } else {
                fields.forEach(field => {
                    if (field.tagName === 'SELECT') {
                        field.removeAttribute('disabled');
                    } else {
                        field.removeAttribute('readonly');
                    }
                });
                lockIcon.className = 'fa-solid fa-lock-open me-1';
                lockText.innerText = '編輯中';
                lockBtn.className = 'btn btn-success btn-sm fw-bold';
                submitBtn.classList.remove('d-none');
                hint.classList.add('d-none');
            }
        }

        function toggleLock() {
            setLockState(!isLocked);
        }

        // 3. 新增 / 編輯房間 (POST / PUT)
        async function saveRoom(e) {
            e.preventDefault();
            if (isLocked) return;

            const id = document.getElementById('roomId').value;
            const payload = {
                roomId: id ? parseInt(id) : null,
                roomNumber: document.getElementById('roomNumber').value,
                roomTypeId: parseInt(document.getElementById('roomTypeId').value),
                floor: parseInt(document.getElementById('floor').value),
                roomStatus: document.getElementById('roomStatus').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE_URL}/${id}` : API_BASE_URL;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || '儲存失敗');
                }

                modalInstance.hide();
                showAlert('alertSuccess', id ? '房間更新成功！' : '新增房間成功！');
                loadRooms();
            } catch (err) {
                showAlert('alertError', err.message);
            }
        }

        // 4. 開啟刪除二次確認 Modal
        function openDeleteConfirm(id) {
            const item = roomList.find(r => r.roomId === id);
            if (!item) return;

            pendingDeleteId = id;
            document.getElementById('deleteTargetInfo').innerText = `[ID: ${item.roomId}] 房號：${item.roomNumber} (${item.floor} 樓)`;
            deleteModalInstance.show();
        }

        // 5. 執行刪除房間 (DELETE)
        async function executeDelete() {
            if (!pendingDeleteId) return;

            try {
                const response = await fetch(`${API_BASE_URL}/${pendingDeleteId}`, { method: 'DELETE' });
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || '刪除失敗');
                }

                deleteModalInstance.hide();
                showAlert('alertSuccess', '房間已成功刪除！');
                pendingDeleteId = null;
                loadRooms();
            } catch (err) {
                deleteModalInstance.hide();
                showAlert('alertError', err.message);
            }
        }

        // 清空表單
        function clearForm() {
            document.getElementById('modalTitle').innerText = '新增房間';
            document.getElementById('roomForm').reset();
            document.getElementById('roomId').value = '';
            document.getElementById('roomStatus').value = '可預訂';

            document.getElementById('lockToggleBtn').classList.add('d-none');
            setLockState(false);
        }

        // 按下編輯按鈕觸發
        function onEditBtnClick(id) {
            const item = roomList.find(r => r.roomId === id);
            if (item) editRoom(item);
        }

        // 填入資料並開啟
        function editRoom(item) {
            document.getElementById('modalTitle').innerText = '查看 / 編輯房間資料';
            document.getElementById('roomId').value = item.roomId;
            document.getElementById('roomNumber').value = item.roomNumber || '';
            document.getElementById('roomTypeId').value = item.roomTypeId || '';
            document.getElementById('floor').value = item.floor || '';
            document.getElementById('roomStatus').value = item.roomStatus || '可預訂';

            document.getElementById('lockToggleBtn').classList.remove('d-none');
            setLockState(true);

            modalInstance.show();
        }

        // 提示訊息控制
        function showAlert(id, msg) {
            const alertElem = document.getElementById(id);
            const msgElem = document.getElementById(id + 'Msg');
            if (msgElem) msgElem.innerText = msg;
            alertElem.classList.remove('d-none');
        }

        function hideAlert(id) {
            document.getElementById(id).classList.add('d-none');
        }

        // XSS 防護
        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }
    </script>
</body>

</html>
