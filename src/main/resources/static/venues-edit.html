<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯場地 - SereneStay 飯店</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-actions {
            margin-top: 30px;
        }

        .btn {
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">SereneStay 飯店管理系統</h1>
            <ul class="nav-menu">
                <li><a href="/">首頁</a></li>
                <li><a href="/products.html">產品管理</a></li>
                <li><a href="/venues.html">場地管理</a></li>
                <li><a href="/rentals.html">租賃管理</a></li>
                <li><a href="/room-types.html">房型管理</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-container">
        <h1>編輯場地</h1>

        <div id="loading" class="loading">載入中...</div>
        <form id="venueForm" style="display: none;">
            <div class="form-group">
                <label for="venueId">場地 ID</label>
                <input type="number" id="venueId" name="venueId" readonly>
            </div>

            <div class="form-group">
                <label for="venueName">場地名稱 *</label>
                <input type="text" id="venueName" name="venueName" maxlength="50" required>
            </div>

            <div class="form-group">
                <label for="capacity">容納人數 *</label>
                <input type="number" id="capacity" name="capacity" min="1" required>
            </div>

            <div class="form-group">
                <label for="pricePerDay">每日租借價格 *</label>
                <input type="number" id="pricePerDay" name="pricePerDay" min="0" required>
            </div>

            <div class="form-group">
                <label for="venueStatus">場地狀態 *</label>
                <select id="venueStatus" name="venueStatus" required>
                    <option value="AVAILABLE">AVAILABLE - 可租借</option>
                    <option value="MAINTENANCE">MAINTENANCE - 維修中</option>
                    <option value="DISABLED">DISABLED - 停止使用</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">更新</button>
                <a href="/venues.html" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 SereneStay 飯店. 所有權利保留。</p>
    </footer>

    <script type="module">
        import { getVenueById, updateVenue, isSuccess, getData } from '/js/api.js';

        const params = new URLSearchParams(window.location.search);
        const venueId = params.get('id');

        if (!venueId) {
            document.getElementById('loading').textContent = '缺少場地 ID';
            window.location.href = '/venues.html';
        }

        async function loadVenue() {
            const loading = document.getElementById('loading');
            const form = document.getElementById('venueForm');

            try {
                const response = await getVenueById(venueId);
                if (isSuccess(response)) {
                    const venue = getData(response);
                    document.getElementById('venueId').value = venue.venueId;
                    document.getElementById('venueName').value = venue.venueName || '';
                    document.getElementById('capacity').value = venue.capacity || '';
                    document.getElementById('pricePerDay').value = venue.pricePerDay || '';
                    document.getElementById('venueStatus').value = venue.venueStatus || 'AVAILABLE';

                    loading.style.display = 'none';
                    form.style.display = 'block';
                } else {
                    loading.textContent = '載入失敗';
                }
            } catch (error) {
                console.error('載入場地失敗:', error);
                loading.textContent = '載入出錯';
            }
        }

        document.getElementById('venueForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = {
                venueId: parseInt(document.getElementById('venueId').value),
                venueName: document.getElementById('venueName').value,
                capacity: parseInt(document.getElementById('capacity').value),
                pricePerDay: parseInt(document.getElementById('pricePerDay').value),
                venueStatus: document.getElementById('venueStatus').value
            };

            try {
                const response = await updateVenue(venueId, formData);
                if (isSuccess(response)) {
                    alert('場地已更新');
                    window.location.href = '/venues.html';
                } else {
                    alert('更新失敗: ' + response.message);
                }
            } catch (error) {
                alert('更新出錯: ' + error.message);
            }
        });

        // 頁面載入時執行
        loadVenue();
    </script>
</body>

</html>
