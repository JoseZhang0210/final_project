<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單管理 - SereneStay 飯店</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .action-bar {
            margin-bottom: 20px;
        }

        .action-bar button,
        .action-bar a {
            margin-right: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .btn {
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo"><a href="/" style="color: white; text-decoration: none;">SereneStay 飯店管理系統</a></h1>
            <ul class="nav-menu">
                <li><a href="/index.html">首頁</a></li>
                <li><a href="/products.html">產品管理</a></li>
                <li><a href="/venues.html">場地管理</a></li>
                <li><a href="/rentals.html">租賃管理</a></li>
                <li><a href="/room-types.html">房型管理</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-container">
        <h1>訂單管理</h1>

        <div class="action-bar">
            <a href="/" class="btn btn-primary">返回首頁</a>
        </div>

        <div id="loading" class="loading">載入中...</div>
        <table id="bookingTable" style="display: none;">
            <thead>
                <tr>
                    <th>訂單 ID</th>
                    <th>會員 ID</th>
                    <th>訂單總金額</th>
                    <th>訂單狀態</th>
                    <th>建立時間</th>
                    <th>付款 ID</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="bookingList">
            </tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2024 SereneStay 飯店. 所有權利保留。</p>
    </footer>

    <script type="module">
        import { getBookingOrders, deleteBookingOrder, isSuccess, getData } from '/js/api.js';

        async function loadBookingOrders() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('bookingTable');
            const tbody = document.getElementById('bookingList');

            try {
                const response = await getBookingOrders();
                if (isSuccess(response)) {
                    const orders = getData(response);
                    tbody.innerHTML = '';

                    if (orders && orders.length > 0) {
                        orders.forEach(order => {
                            const row = document.createElement('tr');
                            const createdAt = order.createdAt ? new Date(order.createdAt).toLocaleString('zh-TW') : 'N/A';
                            row.innerHTML = `
                                <td>${order.bookingOrderId}</td>
                                <td>${order.memberid || 'N/A'}</td>
                                <td>$${order.bookingTotalPrice || 0}</td>
                                <td>${order.orderStatus || 'N/A'}</td>
                                <td>${createdAt}</td>
                                <td>${order.paymentId || 'N/A'}</td>
                                <td>
                                    <button class="btn" onclick="viewOrder(${order.bookingOrderId})">查看</button>
                                    <button class="btn btn-danger" onclick="deleteOrderConfirm(${order.bookingOrderId})">刪除</button>
                                </td>
                            `;
                            tbody.appendChild(row);
                        });
                    }
                    loading.style.display = 'none';
                    table.style.display = 'table';
                } else {
                    loading.textContent = '載入失敗';
                }
            } catch (error) {
                console.error('載入訂單失敗:', error);
                loading.textContent = '載入出錯';
            }
        }

        window.viewOrder = function (id) {
            alert('訂單編號: ' + id + '\n更多詳情功能即將推出');
        };

        window.deleteOrderConfirm = async function (id) {
            if (confirm('確定要刪除此訂單嗎？')) {
                try {
                    const response = await deleteBookingOrder(id);
                    if (isSuccess(response)) {
                        alert('訂單已刪除');
                        loadBookingOrders();
                    } else {
                        alert('刪除失敗: ' + response.message);
                    }
                } catch (error) {
                    alert('刪除出錯: ' + error.message);
                }
            }
        };

        // 頁面載入時執行
        loadBookingOrders();
    </script>
</body>

</html>
