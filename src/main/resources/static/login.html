<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 | SereneStay</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <section class="features" style="max-width: 460px; margin: 4rem auto;">
            <h1>登入</h1>
            <p id="message" role="alert"></p>
            <form action="/login" method="post">
                <input type="hidden" name="_csrf" id="csrfToken">
                <div class="form-group">
                    <label for="username">帳號</label>
                    <input id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary" type="submit">登入</button>
                <a class="btn btn-secondary" href="/register.html">建立帳號</a>
            </form>
        </section>
    </main>
    <script>
        const cookie = document.cookie.split('; ').find(value => value.startsWith('XSRF-TOKEN='));
        document.getElementById('csrfToken').value = cookie
            ? decodeURIComponent(cookie.substring('XSRF-TOKEN='.length)) : '';
        if (new URLSearchParams(window.location.search).has('error')) {
            document.getElementById('message').textContent = '帳號或密碼錯誤。';
        } else if (new URLSearchParams(window.location.search).has('registered')) {
            document.getElementById('message').textContent = '註冊完成，請使用新帳號登入。';
        }
    </script>
</body>
</html>
