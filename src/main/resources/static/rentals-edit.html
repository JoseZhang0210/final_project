<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯租借 - SereneStay 飯店</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        input[type="datetime-local"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-actions {
            margin-top: 30px;
        }

        .btn {
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">SereneStay 飯店管理系統</h1>
            <ul class="nav-menu">
                <li><a href="/">首頁</a></li>
                <li><a href="/products.html">產品管理</a></li>
                <li><a href="/venues.html">場地管理</a></li>
                <li><a href="/rentals.html">租賃管理</a></li>
                <li><a href="/room-types.html">房型管理</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-container">
        <h1>編輯租借</h1>

        <div id="loading" class="loading">載入中...</div>
        <form id="rentalForm" style="display: none;">
            <div class="form-group">
                <label for="rentalId">租借 ID</label>
                <input type="number" id="rentalId" name="rentalId" readonly>
            </div>

            <div class="form-group">
                <label for="venueId">場地 ID *</label>
                <input type="number" id="venueId" name="venueId" required>
            </div>

            <div class="form-group">
                <label for="memberId">會員 ID *</label>
                <input type="number" id="memberId" name="memberId" required>
            </div>

            <div class="form-group">
                <label for="eventName">活動名稱 *</label>
                <input type="text" id="eventName" name="eventName" maxlength="50" required>
            </div>

            <div class="form-group">
                <label for="rentalDate">租借日期與時間 *</label>
                <input type="datetime-local" id="rentalDate" name="rentalDate" required>
            </div>

            <div class="form-group">
                <label for="guestCount">參加人數 *</label>
                <input type="number" id="guestCount" name="guestCount" min="1" required>
            </div>

            <div class="form-group">
                <label for="paymentId">付款 ID *</label>
                <input type="number" id="paymentId" name="paymentId" required>
            </div>

            <div class="form-group">
                <label for="rentalStatus">租借狀態</label>
                <select id="rentalStatus" name="rentalStatus">
                    <option value="PENDING">PENDING - 待確認</option>
                    <option value="CONFIRMED">CONFIRMED - 已確認</option>
                    <option value="CANCELLED">CANCELLED - 已取消</option>
                    <option value="COMPLETED">COMPLETED - 已完成</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">更新</button>
                <a href="/rentals.html" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 SereneStay 飯店. 所有權利保留。</p>
    </footer>

    <script type="module">
        import { getRentalById, updateRental, isSuccess, getData } from '/js/api.js';

        const params = new URLSearchParams(window.location.search);
        const rentalId = params.get('id');

        if (!rentalId) {
            document.getElementById('loading').textContent = '缺少租借 ID';
            window.location.href = '/rentals.html';
        }

        async function loadRental() {
            const loading = document.getElementById('loading');
            const form = document.getElementById('rentalForm');

            try {
                const response = await getRentalById(rentalId);
                if (isSuccess(response)) {
                    const rental = getData(response);
                    document.getElementById('rentalId').value = rental.rentalId;
                    document.getElementById('venueId').value = rental.venueId || '';
                    document.getElementById('memberId').value = rental.memberId || '';
                    document.getElementById('eventName').value = rental.eventName || '';

                    // 轉換 rentalDate 為 datetime-local 格式
                    const dateObj = new Date(rental.rentalDate);
                    const localDateString = dateObj.toISOString().slice(0, 16);
                    document.getElementById('rentalDate').value = localDateString;

                    document.getElementById('guestCount').value = rental.guestCount || '';
                    document.getElementById('paymentId').value = rental.paymentId || '';
                    document.getElementById('rentalStatus').value = rental.rentalStatus || 'PENDING';

                    loading.style.display = 'none';
                    form.style.display = 'block';
                } else {
                    loading.textContent = '載入失敗';
                }
            } catch (error) {
                console.error('載入租借失敗:', error);
                loading.textContent = '載入出錯';
            }
        }

        document.getElementById('rentalForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = {
                rentalId: parseInt(document.getElementById('rentalId').value),
                venueId: parseInt(document.getElementById('venueId').value),
                memberId: parseInt(document.getElementById('memberId').value),
                eventName: document.getElementById('eventName').value,
                rentalDate: document.getElementById('rentalDate').value,
                guestCount: parseInt(document.getElementById('guestCount').value),
                paymentId: parseInt(document.getElementById('paymentId').value),
                rentalStatus: document.getElementById('rentalStatus').value
            };

            try {
                const response = await updateRental(rentalId, formData);
                if (isSuccess(response)) {
                    alert('租借已更新');
                    window.location.href = '/rentals.html';
                } else {
                    alert('更新失敗: ' + response.message);
                }
            } catch (error) {
                alert('更新出錯: ' + error.message);
            }
        });

        // 頁面載入時執行
        loadRental();
    </script>
</body>

</html>
