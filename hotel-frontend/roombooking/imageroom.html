<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飯店管理系統 - Image Management</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome 圖示 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- 專案共用與頁面專屬 CSS -->
    <link rel="stylesheet" href="/css/roombooking/style.css" />
  </head>

  <body class="bg-light">
    <!-- Dashboard 主結構 -->
    <div class="admin-wrapper d-flex" id="wrapper">
      <!-- ⬅️ 左側固定導覽列 Sidebar -->
      <aside
        class="sidebar bg-dark text-white p-3 d-flex flex-column"
        id="sidebar"
      >
        <!-- 品牌名稱區 -->
        <div
          class="brand fs-4 fw-bold mb-3 pb-2 border-bottom text-center d-flex align-items-center justify-content-center gap-2"
        >
          <i class="fa-solid fa-hotel"></i>
          <span class="sidebar-text">飯店管理系統</span>
        </div>

        <ul class="nav nav-pills flex-column mb-auto">
          <!-- 📂 可折疊主目錄：房間設計管理 -->
          <li class="nav-item">
            <a
              href="#roomSubmenu"
              data-bs-toggle="collapse"
              aria-expanded="true"
              class="nav-link text-white d-flex align-items-center justify-content-between"
            >
              <div>
                <i class="fa-solid fa-bed me-2"></i>
                <span class="sidebar-text fw-bold">房間設計管理</span>
              </div>
              <i class="fa-solid fa-chevron-down small sidebar-text"></i>
            </a>

            <!-- 6 個子項目列表 -->
            <div class="collapse show ps-3 mt-1" id="roomSubmenu">
              <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                  <a
                    href="/roombooking/bookingorder.html"
                    class="nav-link text-white-50 py-2 my-1"
                  >
                    <i class="fa-solid fa-file-invoice-dollar me-2"></i>
                    <span class="sidebar-text">訂房訂單管理</span>
                  </a>
                </li>

                <li class="nav-item">
                  <a
                    href="/roombooking/booking.html"
                    class="nav-link text-white-50 py-2 my-1"
                  >
                    <i class="fa-solid fa-calendar-check me-2"></i>
                    <span class="sidebar-text">入住明細管理</span>
                  </a>
                </li>
                <li class="nav-item">
                  <a
                    href="/roombooking/room.html"
                    class="nav-link text-white-50 py-2 my-1"
                  >
                    <i class="fa-solid fa-door-closed me-2"></i>
                    <span class="sidebar-text">房間狀態管理</span>
                  </a>
                </li>
                <li class="nav-item">
                  <a
                    href="/roombooking/roomtask.html"
                    class="nav-link text-white-50 py-2 my-1"
                  >
                    <i class="fa-solid fa-broom me-2"></i>
                    <span class="sidebar-text">房務維護任務</span>
                  </a>
                </li>

                <li class="nav-item">
                  <a
                    href="/roombooking/roomtype.html"
                    class="nav-link text-white-50 py-2 my-1"
                  >
                    <i class="fa-solid fa-sliders me-2"></i>
                    <span class="sidebar-text">房型設定管理</span>
                  </a>
                </li>

                <li class="nav-item">
                  <a
                    href="/roombooking/imageroom.html"
                    class="nav-link active py-2 my-1"
                  >
                    <i class="fa-solid fa-image me-2"></i>
                    <span class="sidebar-text">房間圖片管理</span>
                  </a>
                </li>
              </ul>
            </div>
          </li>
        </ul>
      </aside>

      <!-- ➡️ 右側主要工作區域 Main Content -->
      <main class="main-content flex-fill overflow-auto vh-100">
        <!-- 頂部列：包含三條線切換按鈕與麵包屑 -->
        <header
          class="bg-white border-bottom p-3 d-flex align-items-center shadow-sm"
        >
          <button
            class="btn btn-light border-0 me-3"
            id="sidebarToggle"
            type="button"
          >
            <i class="fa-solid fa-bars fs-5"></i>
          </button>
          <span class="fw-bold text-secondary"
            >房間設計管理 / 房間圖片管理</span
          >
        </header>

        <div class="p-4">
          <!-- 訊息提示區 -->
          <div
            id="alertError"
            class="alert alert-danger alert-dismissible fade show shadow-sm d-none mb-3"
            role="alert"
          >
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span id="alertErrorMsg">操作失敗！</span>
            <button
              type="button"
              class="btn-close"
              onclick="hideAlert('alertError')"
            ></button>
          </div>
          <div
            id="alertSuccess"
            class="alert alert-success alert-dismissible fade show shadow-sm d-none mb-3"
            role="alert"
          >
            <i class="fa-solid fa-circle-check me-2"></i>
            <span id="alertSuccessMsg">操作成功！</span>
            <button
              type="button"
              class="btn-close"
              onclick="hideAlert('alertSuccess')"
            ></button>
          </div>

          <!-- 頁面標題區塊 -->
          <div
            class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom"
          >
            <h2><i class="fa-solid fa-image me-2"></i>圖片資料管理系統</h2>
            <button
              type="button"
              class="btn btn-success shadow-sm"
              data-bs-toggle="modal"
              data-bs-target="#imageModal"
              onclick="clearForm()"
            >
              <i class="fa-solid fa-plus me-1"></i> 新增圖片
            </button>
          </div>

          <!-- 🔍 搜尋與篩選列 -->
          <div class="card shadow-sm mb-4 border-0">
            <div class="card-body p-3">
              <form
                id="searchForm"
                onsubmit="handleSearch(event)"
                class="row g-3 align-items-center"
              >
                <div class="col-md-9">
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                      <i class="fa-solid fa-magnifying-glass text-muted"></i>
                    </span>
                    <input
                      type="text"
                      class="form-control border-start-0 ps-0"
                      id="searchInput"
                      placeholder="搜尋圖片 ID、路徑或描述..."
                    />
                  </div>
                </div>
                <div class="col-md-3 d-flex gap-2">
                  <button type="submit" class="btn btn-primary flex-fill">
                    <i class="fa-solid fa-search me-1"></i> 搜尋
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    onclick="resetSearch()"
                  >
                    <i class="fa-solid fa-rotate-left me-1"></i> 重設
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- 資料表格 -->
          <div class="card shadow-sm border-0">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-dark">
                    <tr>
                      <th scope="col" class="ps-3" style="width: 100px">
                        圖片 ID
                      </th>
                      <th scope="col" style="width: 100px">預覽</th>
                      <th scope="col">儲存路徑 (Path)</th>
                      <th scope="col">圖片描述 (Image Description)</th>
                      <th scope="col" class="text-center" style="width: 180px">
                        操作
                      </th>
                    </tr>
                  </thead>
                  <tbody id="imageTableBody">
                    <tr>
                      <td colspan="5" class="text-center py-4 text-muted">
                        <i class="fa-solid fa-spinner fa-spin me-2"></i
                        >載入資料中...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- 新增 / 編輯 圖片 Modal -->
    <div
      class="modal fade"
      id="imageModal"
      tabindex="-1"
      aria-labelledby="modalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <form
            id="imageForm"
            action="/api/images/uploadimagesroompic"
            method="POST"
            onsubmit="uploadimagesroompic(event)"
            enctype="multipart/form-data"
          >
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title" id="modalTitle">圖片設定</h5>
              <div class="ms-auto me-2">
                <button
                  type="button"
                  id="lockToggleBtn"
                  class="btn btn-warning btn-sm fw-bold"
                  onclick="toggleLock()"
                >
                  <i class="fa-solid fa-lock me-1" id="lockIcon"></i>
                  <span id="lockText">點擊解鎖</span>
                </button>
              </div>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <!-- 隱藏欄位：圖片 ID 與已選取的 static 路徑 -->
              <input type="hidden" id="imageId" name="imageId" />
              <input
                type="hidden"
                id="selectedStaticPath"
                name="selectedStaticPath"
              />

              <!-- 圖片預覽區 -->
              <div class="mb-3 text-center d-none" id="previewContainer">
                <p class="form-label text-start fw-bold">當前圖片預覽：</p>
                <img
                  id="imagePreview"
                  src=""
                  alt="預覽"
                  class="img-thumbnail shadow-sm"
                  style="max-height: 180px; object-fit: contain"
                />
              </div>

              <!-- 模式 1：選擇專案內部預設圖片 (static) -->
              <div class="mb-3">
                <label for="existingImageSelect" class="form-label fw-bold">
                  <i class="fa-solid fa-folder-open text-primary me-1"></i>
                  選擇專案預設圖片 (static) / 已上傳圖片：
                </label>
                <select
                  id="existingImageSelect"
                  class="form-select editable-field"
                  onchange="onSelectExistingImage(this)"
                >
                  <option value="">-- 請選擇圖片 (或下方上傳新圖) --</option>
                  <option value="/images/room/roomtype.1.jpg">
                    房型圖 1 (/images/room/roomtype.1.jpg)
                  </option>
                  <option value="/images/room/roomtype.2.jpg">
                    房型圖 2 (/images/room/roomtype.2.jpg)
                  </option>
                  <option value="/images/room/roomtype.3.jpg">
                    房型圖 3 (/images/room/roomtype.3.jpg)
                  </option>
                  <option value="/images/room/roomtype.4.jpg">
                    房型圖 4 (/images/room/roomtype.4.jpg)
                  </option>
                  <option value="/images/room/roomtype.5.jpg">
                    房型圖 5 (/images/room/roomtype.5.jpg)
                  </option>
                  <option value="/images/room/roomtype.6.jpg">
                    房型圖 6 (/images/room/roomtype.6.jpg)
                  </option>
                  <option value="/images/room/roomtype.7.jpg">
                    房型圖 7 (/images/room/roomtype.7.jpg)
                  </option>
                  <option value="/images/room/roomtype.8.jpg">
                    房型圖 8 (/images/room/roomtype.8.jpg)
                  </option>
                  <option value="/images/room/roomtype.9.jpg">
                    房型圖 9 (/images/room/roomtype.9.jpg)
                  </option>
                  <option value="/images/room/roomtype.10.jpg">
                    房型圖 10 (/images/room/roomtype.10.jpg)
                  </option>
                </select>
              </div>

              <div class="text-center my-3 text-muted small fw-bold">
                - 或 -
              </div>

              <!-- 模式 2：上傳實體圖片檔案 (uploads) -->
              <div class="mb-3">
                <label for="fileInput" class="form-label fw-bold">
                  <i class="fa-solid fa-upload text-success me-1"></i>
                  動態上傳新圖片檔案：
                </label>
                <input
                  type="file"
                  class="form-control editable-field"
                  id="fileInput"
                  name="file"
                  accept="image/*"
                  onchange="handleFileSelect(event)"
                />
                <div class="form-text">
                  檔案將上傳至伺服器目錄，並自動設定相對路徑。
                </div>
              </div>

              <!-- 圖片描述 -->
              <div class="mb-3">
                <label for="imageDesc" class="form-label fw-bold">
                  圖片描述 (Image Description)
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control editable-field"
                  id="imageDesc"
                  name="imageDesc"
                  required
                  placeholder="例如：海景頂級皇家總統套房"
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                取消
              </button>
              <button type="submit" id="btnSubmit" class="btn btn-primary">
                儲存資料
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 刪除確認 Modal -->
    <div
      class="modal fade"
      id="deleteConfirmModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title">
              <i class="fa-solid fa-triangle-exclamation me-2"></i>確認刪除
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body text-center py-4">
            <p class="fs-5 mb-2">確定要刪除該圖片資料嗎？</p>
            <div
              class="alert alert-warning d-inline-block text-start px-4 py-2 mb-3"
            >
              <strong id="deleteTargetInfo">載入中...</strong>
            </div>
          </div>
          <div class="modal-footer justify-content-center">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              取消
            </button>
            <button
              type="button"
              class="btn btn-danger"
              onclick="executeDelete()"
            >
              <i class="fa-solid fa-trash me-1"></i>確認刪除
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入獨立邏輯檔案 -->
    <script src="../js/roombooking/image-room.js"></script>
  </body>
</html>
