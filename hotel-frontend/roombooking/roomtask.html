<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>房務任務管理系統 - Room Task Management</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome 圖示 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <!-- 頁面標題與操作按鈕區 -->
      <div
        class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom"
      >
        <h2><i class="fa-solid fa-broom me-2"></i>房務任務管理系統</h2>
        <div>
          <a href="/" class="btn btn-outline-secondary me-2">
            <i class="fa-solid fa-home me-1"></i> 返回首頁
          </a>
          <button
            type="button"
            class="btn btn-success"
            data-bs-toggle="modal"
            data-bs-target="#roomTaskModal"
            onclick="clearForm()"
          >
            <i class="fa-solid fa-plus me-1"></i> 新增任務
          </button>
        </div>
      </div>

      <!-- 訊息提示區 -->
      <div
        id="alertError"
        class="alert alert-danger alert-dismissible fade show shadow-sm d-none"
        role="alert"
      >
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <span id="alertErrorMsg">操作失敗！</span>
        <button
          type="button"
          class="btn-close"
          onclick="hideAlert('alertError')"
        ></button>
      </div>
      <div
        id="alertSuccess"
        class="alert alert-success alert-dismissible fade show shadow-sm d-none"
        role="alert"
      >
        <i class="fa-solid fa-circle-check me-2"></i>
        <span id="alertSuccessMsg">操作成功！</span>
        <button
          type="button"
          class="btn-close"
          onclick="hideAlert('alertSuccess')"
        ></button>
      </div>

      <!-- 🔍 搜尋與篩選區塊 -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <form
            id="searchForm"
            onsubmit="handleSearch(event)"
            class="row g-3 align-items-center"
          >
            <div class="col-md-3">
              <div class="input-group">
                <span class="input-group-text bg-light"
                  ><i class="fa-solid fa-magnifying-glass"></i
                ></span>
                <input
                  type="text"
                  class="form-control"
                  id="searchInput"
                  placeholder="搜尋備註、房間或員工ID..."
                />
              </div>
            </div>
            <div class="col-md-2">
              <select class="form-select" id="taskTypeFilter">
                <option value="">所有任務類型</option>
                <option value="1">退房清潔</option>
                <option value="2">續住清潔</option>
                <option value="3">設備維修</option>
                <option value="4">補充備品</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select" id="priorityFilter">
                <option value="">所有優先級</option>
                <option value="1">低</option>
                <option value="2">普通</option>
                <option value="3">緊急</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select" id="statusFilter">
                <option value="">所有狀態</option>
                <option value="1">待處理</option>
                <option value="2">進行中</option>
                <option value="3">已完成</option>
                <option value="4">已取消</option>
              </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-fill">
                <i class="fa-solid fa-search me-1"></i> 搜尋
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="resetSearch()"
              >
                <i class="fa-solid fa-rotate-left me-1"></i> 重設
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- 任務列表表格 -->
      <div class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th scope="col" class="ps-3">任務 ID</th>
                  <th scope="col">房間 ID</th>
                  <th scope="col">員工 ID</th>
                  <th scope="col">任務類型</th>
                  <th scope="col">優先級</th>
                  <th scope="col">狀態</th>
                  <th scope="col">建立時間</th>
                  <th scope="col">完成時間</th>
                  <th scope="col">備註</th>
                  <th scope="col" class="text-center">操作</th>
                </tr>
              </thead>
              <tbody id="roomTaskTableBody">
                <tr>
                  <td colspan="10" class="text-center py-4 text-muted">
                    載入資料中...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- 新增 / 編輯 房務任務 Modal -->
    <div
      class="modal fade"
      id="roomTaskModal"
      tabindex="-1"
      aria-labelledby="modalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <form id="roomTaskForm" onsubmit="saveRoomTask(event)">
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title" id="modalTitle">新增房務任務</h5>

              <div class="ms-auto me-2">
                <button
                  type="button"
                  id="lockToggleBtn"
                  class="btn btn-warning btn-sm fw-bold"
                  onclick="toggleLock()"
                >
                  <i class="fa-solid fa-lock me-1" id="lockIcon"></i>
                  <span id="lockText">點擊解鎖</span>
                </button>
              </div>

              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <!-- 主鍵 ID -->
              <input type="hidden" id="taskId" name="taskId" />

              <div
                class="fw-bold border-bottom pb-2 mb-3 text-primary d-flex justify-content-between align-items-center"
              >
                <span
                  ><i class="fa-solid fa-clipboard-list me-1"></i>
                  任務詳細資訊</span
                >
                <small id="readonlyHint" class="text-muted fw-normal d-none">
                  <i class="fa-solid fa-circle-info me-1"></i
                  >目前為唯讀狀態，點擊右上角鎖頭即可編輯
                </small>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="roomId" class="form-label"
                    >房間 ID <span class="text-danger">*</span></label
                  >
                  <input
                    type="number"
                    class="form-control editable-field"
                    id="roomId"
                    name="roomId"
                    required
                    placeholder="例如：101"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="employeeId" class="form-label"
                    >負責員工 ID <span class="text-danger">*</span></label
                  >
                  <input
                    type="number"
                    class="form-control editable-field"
                    id="employeeId"
                    name="employeeId"
                    required
                    placeholder="例如：5"
                  />
                </div>
              </div>

              <div class="row">
                <div class="col-md-4 mb-3">
                  <label for="taskType" class="form-label"
                    >任務類型 <span class="text-danger">*</span></label
                  >
                  <select
                    class="form-select editable-field"
                    id="taskType"
                    name="taskType"
                    required
                  >
                    <option value="" disabled selected>請選擇類型</option>
                    <option value="1">退房清潔</option>
                    <option value="2">續住清潔</option>
                    <option value="3">設備維修</option>
                    <option value="4">補充備品</option>
                  </select>
                </div>
                <div class="col-md-4 mb-3">
                  <label for="priority" class="form-label"
                    >優先級 <span class="text-danger">*</span></label
                  >
                  <select
                    class="form-select editable-field"
                    id="priority"
                    name="priority"
                    required
                  >
                    <option value="" disabled selected>請選擇優先級</option>
                    <option value="1">低</option>
                    <option value="2">普通</option>
                    <option value="3">緊急</option>
                  </select>
                </div>
                <div class="col-md-4 mb-3">
                  <label for="taskStatus" class="form-label"
                    >任務狀態 <span class="text-danger">*</span></label
                  >
                  <select
                    class="form-select editable-field"
                    id="taskStatus"
                    name="taskStatus"
                    required
                  >
                    <option value="1">待處理</option>
                    <option value="2">進行中</option>
                    <option value="3">已完成</option>
                    <option value="4">已取消</option>
                  </select>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="createdAt" class="form-label">建立時間</label>
                  <input
                    type="datetime-local"
                    class="form-control editable-field"
                    id="createdAt"
                    name="createdAt"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="completedAt" class="form-label">完成時間</label>
                  <input
                    type="datetime-local"
                    class="form-control editable-field"
                    id="completedAt"
                    name="completedAt"
                  />
                </div>
              </div>

              <div class="mb-3">
                <label for="remark" class="form-label"
                  >備註說明 <span class="text-danger">*</span></label
                >
                <textarea
                  class="form-control editable-field"
                  id="remark"
                  name="remark"
                  rows="3"
                  maxlength="50"
                  required
                  style="resize: none"
                  placeholder="例如：馬桶堵塞或冷氣不冷..."
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                取消
              </button>
              <button type="submit" id="btnSubmit" class="btn btn-primary">
                儲存資料
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 刪除二次確認 Modal -->
    <div
      class="modal fade"
      id="deleteConfirmModal"
      tabindex="-1"
      aria-labelledby="deleteModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="deleteModalTitle">
              <i class="fa-solid fa-triangle-exclamation me-2"></i>確認刪除任務
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body text-center py-4">
            <p class="fs-5 mb-2">確定要刪除以下房務任務嗎？</p>
            <div
              class="alert alert-warning d-inline-block text-start px-4 py-2 mb-3"
            >
              <strong id="deleteTargetInfo">任務資料載入中...</strong>
            </div>
            <p class="text-danger small mb-0">
              <i class="fa-solid fa-circle-info me-1"></i
              >此操作無法復原，請謹慎確認！
            </p>
          </div>
          <div class="modal-footer justify-content-center">
            <button
              type="button"
              class="btn btn-secondary px-4"
              data-bs-dismiss="modal"
            >
              取消
            </button>
            <button
              type="button"
              class="btn btn-danger px-4"
              onclick="executeDelete()"
            >
              <i class="fa-solid fa-trash me-1"></i>確認刪除
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入獨立的 JS 邏輯檔 -->
    <script src="../js/roombooking/room-task.js"></script>
  </body>
</html>
