    <circle cx="40" cy="40" r="31" fill="none" stroke="#d9bc7a" stroke-width="1.2" />
    <path d="M40 14c.7 6.1 4 9.6 10 11-6 1.4-9.3 4.9-10 11-.7-6.1-4-9.6-10-11 6-1.4 9.3-4.9 10-11Z" fill="url(#emblem-gold)" />
