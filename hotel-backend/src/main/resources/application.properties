spring.application.name=hotel-backend
server.port=8081

# Product image upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#Spring Security
spring.security.user.name=user
spring.security.user.password=1234


# JWT 密鑰
jwt.secret-key=${JWT_SECRET_KEY:myCustomSuperSecretKeyForJWTAuthenticationThatIsLongEnough123456}
jwt.valid-seconds=${JWT_VALID_SECONDS:86400}


#SQL Server DataSource Setting
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=finalproject;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hotel_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


#Spring Data JPA Setting
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# Actuator
management.endpoints.web.base-path=/api/actuator

# Test
logging.level.org.springframework.security=TRACE

# Spring Mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:xingchenghotel2026@gmail.com}
spring.mail.password=${MAIL_PASSWORD:vrzhtezczjumjtau}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Hotel Business Configuration
hotel.default.housekeeper.id=13
