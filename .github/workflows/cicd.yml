name: "Full-Stack CI/CD"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend-ci:
    name: "Frontend (Vue 3) Build Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hotel-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./hotel-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vue project
        run: npm run build

  backend-ci:
    name: "Backend (Spring Boot) Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hotel-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Unit Tests
        run: ./mvnw test

      - name: Compile and package Spring Boot Jar
        run: ./mvnw clean package -DskipTests

  docker-publish:
    name: "Build and Push Docker Image"
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner and repo
        run: echo "IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-backend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-backend
          file: ./hotel-backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
