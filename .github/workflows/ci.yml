name: "Full-Stack CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  frontend-ci:
    name: "Frontend (Vue 3) Build Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hotel-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./hotel-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run code linter
        run: npm run lint --if-present

      - name: Build Vue project
        run: npm run build

  backend-ci:
    name: "Backend (Spring Boot) Build Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hotel-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Compile and package Spring Boot Jar
        run: ./mvnw clean package -DskipTests

